<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية عبدو لهنا ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Cairo;background:linear-gradient(135deg,#ff5e9a,#ffc4de);min-height:100vh;display:flex;justify-content:center;align-items:center}.card{background:white;padding:28px;border-radius:28px;text-align:center;box-shadow:0 15px 40px rgba(255,0,100,.2);width:90%;max-width:320px}.card input{width:100%;padding:12px;border-radius:50px;border:2px solid #ffc2de;text-align:center;font-size:20px;letter-spacing:4px;outline:none}.card button{width:100%;padding:12px;border:none;border-radius:50px;background:#ff2e7e;color:white;font-weight:700;margin-top:12px}#content{display:none;width:90%;max-width:400px;padding:20px;text-align:center;flex-direction:column;align-items:center}#typed-box{background:white;padding:20px;border-radius:20px;line-height:2;text-align:right;white-space:pre-wrap;width:100%;margin-top:15px;box-shadow:0 8px 20px rgba(0,0,0,.1)}</style>
</head>
<body>
<div id="login" class="card">
<h2 style="color:#ff2e7e;margin:0">لـ هنا وبس ❤️</h2>
<p style="color:#888;font-size:13px">اكتبي الباسورد يا قلبي</p>
<input type="password" id="pass" placeholder="••••••">
<button onclick="check()">افتحي هديتك ✨</button>
<p id="err" style="display:none;color:#ff2e7e;margin-top:10px">غلط جربي 201179</p>
</div>
<div id="content">
<img src="hana.jpg" style="width:180px;height:180px;border-radius:50%;object-fit:cover;border:5px solid white;box-shadow:0 10px 25px rgba(0,0,0,.2)">
<h1 style="color:#7a0030">هدية عبدو لهنا ❤️</h1>
<div id="typed-box"></div>
</div>
<audio id="song" src="tamer.mp3" preload="auto" loop></audio>
<script>
const text=`هنا يا روح قلبي ❤️

عاوز اقولك اني بحبك .. بحبك .. بحبك يا هنا
وبحب كل حاجة حلوة فيكي، انتي اكتر واحدة حنينة وطيبة عليا.

وعمري ما هنسى انك مستنياني، واي سر بينا انا محافظ عليه.
انتي اجمل وارق بنت عرفتها في حياتي.

وبحبك يا بنوتي بقلب بابا ❤️
سيبك من حوار اروح لبابا، ما انا بابا ومش هتمشي وتسيبيني، انا عاوزك معايا وجنبي ومحتاجك وبحبك والله العظيم قوي.

انتي روح قلبي، وعارف اني يمكن مش مناسب قوي وفيا عيوب، بس انا بحبك عمتاً ومش شايف فيكي اي عيوب.

من ساعة ما دخلتي حياتي وانا احسن بكتيررر من الاول

ولسه بحبك يا هنااااا ❤️
`;
function check(){
if(document.getElementById('pass').value=='201179'){
let s=document.getElementById('song');
s.volume=0.9;
document.getElementById('login').style.display='none';
document.getElementById('content').style.display='flex';
typeWriter();
s.onloadedmetadata=function(){
  s.currentTime=s.duration/2;
  s.play().catch(()=>{});
};
if(s.readyState>=1){
  s.currentTime=s.duration/2 || 95;
  s.play().catch(()=>{});
}else{
  s.load();
}
}else{document.getElementById('err').style.display='block';}
}
let i=0;function typeWriter(){if(i<text.length){document.getElementById('typed-box').innerHTML+=text.charAt(i);i++;setTimeout(typeWriter,20);}}
</script>
</body>
</html>
